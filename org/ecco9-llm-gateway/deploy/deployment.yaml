apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecco9-llm-gateway
  namespace: ecco9-inference
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-llm-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8093"
    spec:
      containers:
        - name: llm-gateway
          image: ghcr.io/dtechorg/ecco9-llm-gateway:latest
          ports:
            - { name: http, containerPort: 8093 }
          env:
            - name: ECCO9_LLM_GATEWAY_ADDR
              value: ":8093"
            - name: ECCO9_RUNNER_URL
              value: "http://ecco9-runner.ecco9-inference:8094"
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: ecco9-llm-keys, key: openai, optional: true } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: ecco9-llm-keys, key: anthropic, optional: true } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: ecco9-llm-keys, key: openrouter, optional: true } }
            - name: FEATHERLESS_API_KEY
              valueFrom: { secretKeyRef: { name: ecco9-llm-keys, key: featherless, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8093 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8093 }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: 2, memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ecco9-llm-gateway
  namespace: ecco9-inference
spec:
  selector:
    app.kubernetes.io/name: ecco9-llm-gateway
  ports:
    - { name: http, port: 8093, targetPort: 8093 }
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-llm-gateway
  namespace: ecco9-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecco9-llm-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.7" }
