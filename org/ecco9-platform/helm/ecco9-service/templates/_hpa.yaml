{{- define "ecco9-service.hpa" -}}
# HPA driven by the cognitive_load custom metric (not CPU).
# The metric is published by each service's /metrics endpoint and collected
# via the Prometheus adapter.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
  minReplicas: {{ .Values.hpa.minReplicas | default 2 }}
  maxReplicas: {{ .Values.hpa.maxReplicas | default 8 }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: ecco9_cognitive_load
        target:
          type: AverageValue
          averageValue: {{ .Values.hpa.cognitiveLoadTarget | default "0.6" }}
{{- end -}}
