{{- define "ecco9-service.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: ecco9
spec:
  replicas: {{ .Values.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "{{ .Values.metricsPort | default 9090 }}"
    spec:
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: grpc
              containerPort: {{ .Values.grpcPort | default 50051 }}
            - name: metrics
              containerPort: {{ .Values.metricsPort | default 9090 }}
          env:
            - name: ECCO9_NATS_URL
              value: {{ .Values.natsUrl | default "nats://nats.ecco9-data:4222" }}
            - name: ECCO9_SERVICE_NAME
              value: {{ .Values.name }}
            - name: ECCO9_ORCHESTRATOR_ADDR
              value: {{ .Values.orchestratorAddr | default "ecco9-orchestrator.ecco9-platform:50051" }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            grpc:
              port: {{ .Values.grpcPort | default 50051 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.grpcPort | default 50051 }}
            initialDelaySeconds: 15
            periodSeconds: 20
{{- end -}}
