    replicas: 2
    hpa: { minReplicas: 2, maxReplicas: 8, cognitiveLoadTarget: "0.7" }
    resources:
      requests: { cpu: 2, memory: 4Gi }
      limits: { cpu: 4, memory: 8Gi }
    placement:
      # Co-located with the reservoir (temporal core).
      coLocateWith: ecco9-reservoir

- name: ecco9-service
  releaseName: ecco9-runner
  namespace: ecco9-inference
  version: 1.0.0
  valuesInline:
    name: ecco9-runner
    namespace: ecco9-inference
    replicas: 2
    hpa: { minReplicas: 2, maxReplicas: 8, cognitiveLoadTarget: "0.75" }
    # GPU nodes (7.1): requests nvidia GPUs and tolerates the gpu-pool
    # taint, mirroring org/ecco9-runner/deploy/deployment.yaml.
    resources:
      requests: { cpu: 2, memory: 8Gi, nvidia.com/gpu: 1 }
      limits: { cpu: 8, memory: 32Gi, nvidia.com/gpu: 1 }
    placement:
      nodeSelector: { ecco9.io/tier: inference }
      tolerations:
        - { key: ecco9.io/gpu, operator: Equal, value: "true", effect: NoSchedule }
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }

