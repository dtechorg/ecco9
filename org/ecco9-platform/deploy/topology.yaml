# Production topology generator inputs (issue #8, 7.1).
#
# Each entry renders one cognitive service from the shared
# ../helm/ecco9-service library chart into its 7.1 namespace with the
# replica range (HPA bounds), resource envelope, and tier placement from
# the production layout table. kustomization.yaml includes this file via
# its `helmCharts:` list (see the `replacements` note there); keeping the
# entries in a standalone YAML document lets topology_test.go validate the
# 7.1 table without invoking kustomize/helm.
#
# Fields per entry:
#   name/namespace   — service and target namespace from the 7.1 table
#   releaseName      — Helm release (= service name)
#   version          — pinned library chart version
#   valuesInline     — replica floor, HPA bounds, resources, placement
#
# hpa.minReplicas/maxReplicas encode the issue's "Replicas" column
# (2-4, 2-3, 2-8, 1-2, 3+); resources encode the "Resources" column.

- name: ecco9-service
  releaseName: ecco9-reservoir
  namespace: ecco9-core
  version: 1.0.0
  valuesInline:
    name: ecco9-reservoir
    namespace: ecco9-core
    replicas: 2
    hpa: { minReplicas: 2, maxReplicas: 4, cognitiveLoadTarget: "0.6" }
    resources:
      requests: { cpu: 1, memory: 2Gi }
      limits: { cpu: 2, memory: 4Gi }
    placement:
      # Temporal core: high-memory-bandwidth nodes, co-located with the
      # LLM gateway for minimal inference pipeline latency (issue #8,
      # design decision 2; mirrors org/ecco9-reservoir/deploy/statefulset.yaml).
      nodeSelector: { ecco9.io/tier: memory-bandwidth }
      coLocateWith: ecco9-llm-gateway

