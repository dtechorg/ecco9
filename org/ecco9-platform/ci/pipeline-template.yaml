# ecco9 Per-Repo Pipeline Template (Phase 6.1)
#
# Canonical CI/CD pipeline for every org/ecco9-* repository. Each extracted
# repo installs this pipeline (verbatim or via `workflow_call` from
# ecco9-platform) so that every cognitive service ships through the same
# quality gates:
#
#   lint → vet → unit tests (race + coverage) → build → contract tests
#   → image build/push → deploy (canary) → identity-coherence gate
#   → automatic rollback on coherence regression
#
# The template is parameterized by repo archetype:
#
#   archetype: cognitive-service   (Go module with server + cmd, container image)
#              contracts           (ecco9-proto, ecco9-sdk-go — no image/deploy)
#              infra               (ecco9-platform, ecco9-eventmesh — no image)
#
# Key design decision (issue #7): identity coherence is a first-class metric.
# Every deployment pipeline includes an automated identity-coherence check;
# if coherence drops below threshold after a deployment, automatic rollback
# triggers (see servicemesh/rollout-analysis.yaml for the Argo Rollouts
# AnalysisTemplate this pipeline references).

name: ecco9-service-ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      service:
        description: 'Repository/service name, e.g. ecco9-reservoir'
        required: true
        type: string
      archetype:
        description: 'cognitive-service | contracts | infra'
        required: false
        type: string
        default: cognitive-service
      coherence-threshold:
        description: 'Minimum identity coherence required post-deploy'
        required: false
        type: string
        default: '0.7'

permissions:
  contents: read
  packages: write   # image job pushes to ghcr.io
  id-token: none

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.service || github.event.repository.name }}

jobs:
  # ── Stage 1: static analysis ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || (echo "$unformatted" && exit 1)
      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout 5m0s

  # ── Stage 2: vet ──────────────────────────────────────────────────────────
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  # ── Stage 3: unit tests with race detector and coverage ──────────────────
  test:
    needs: [lint, vet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage report
        run: |
          # Coverage is reported but not gated; cognitive services gate on
          # identity coherence instead of line coverage.
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out

  # ── Stage 4: build ────────────────────────────────────────────────────────
  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build all packages
        run: go build ./...
      - name: build service binary
        run: |
          if [ -d cmd ]; then go build -o /tmp/service ./cmd/...; fi

  # ── Stage 5: consumer-driven contract tests ───────────────────────────────
  contract-tests:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: contract tests (Pact-style, from ecco9-platform/ci/integration)
        run: go test -tags=integration -run 'Contract' ./...

  # ── Stage 6: container image (cognitive-service archetype only) ──────────
  image:
    if: (inputs.archetype || 'cognitive-service') == 'cognitive-service'
    needs: [contract-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 7: deploy with identity-coherence gate ──────────────────────────
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: canary rollout via Argo Rollouts
        run: |
          # The rollout references the identity-coherence-gate AnalysisTemplate
          # (org/ecco9-platform/servicemesh/rollout-analysis.yaml):
          #   - identity-coherence >= threshold (default 0.7)
          #   - cognitive-load <= 0.9
          # If coherence drops below threshold after deployment, the rollout
          # aborts and Argo triggers automatic rollback.
          kubectl argo rollouts set image "${SERVICE:-ecco9-service}" \
            "*=${{ env.IMAGE }}:${{ github.sha }}" -n ecco9-core
          kubectl argo rollouts status "${SERVICE:-ecco9-service}" -n ecco9-core \
            --timeout 10m

  # ── Stage 8: coherence regression guard (belt-and-braces rollback) ───────
  coherence-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: verify identity coherence post-deploy
        run: |
          THRESHOLD="${{ inputs.coherence-threshold || '0.7' }}"
          COHERENCE=$(curl -fsS "http://prometheus.ecco9-data:9090/api/v1/query" \
            --data-urlencode 'query=avg(ecco9_identity_coherence)' \
            | jq -r '.data.result[0].value[1] // 0')
          if (( $(echo "$COHERENCE < $THRESHOLD" | bc -l) )); then
            echo "::error::identity coherence $COHERENCE < $THRESHOLD — rolling back"
            kubectl argo rollouts undo "${SERVICE:-ecco9-service}" -n ecco9-core
            exit 1
          fi
