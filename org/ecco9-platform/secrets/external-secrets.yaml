# External Secrets Operator integration for provider API keys.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: ecco9-vault
spec:
  provider:
    vault:
      server: "https://vault.ecco9-data:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ecco9"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-provider-keys
  namespace: ecco9-inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ecco9-vault
    kind: ClusterSecretStore
  target:
    name: llm-provider-keys
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: ecco9/llm
        property: openai_api_key
    - secretKey: anthropic-api-key
      remoteRef:
        key: ecco9/llm
        property: anthropic_api_key
    - secretKey: openrouter-api-key
      remoteRef:
        key: ecco9/llm
        property: openrouter_api_key
