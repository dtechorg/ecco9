# Ontogenesis deployed as a StatefulSet: the genome population and
# entelechy trajectory are durable evolutionary lineage state.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecco9-ontogenesis
  namespace: ecco9-higher
spec:
  serviceName: ecco9-ontogenesis
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-ontogenesis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-ontogenesis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # Co-locate with the reservoir, whose kernels evolve here.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ecco9-reservoir
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ontogenesis
          image: ghcr.io/dtechorg/ecco9-ontogenesis:latest
          ports:
            - { name: http, containerPort: 8091 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: ECCO9_ONTOGENESIS_ADDR
              value: ":8091"
            - name: ECCO9_NATS_URL
              value: "nats://nats.ecco9-data:4222"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: lineage, mountPath: /var/lib/ecco9/ontogenesis }
          resources:
            requests: { cpu: 1, memory: 1Gi }
            limits: { cpu: 4, memory: 4Gi }
  volumeClaimTemplates:
    - metadata:
        name: lineage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ecco9-ontogenesis
  namespace: ecco9-higher
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ecco9-ontogenesis
  ports:
    - { name: http, port: 8091, targetPort: http }
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-ontogenesis
  namespace: ecco9-higher
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ecco9-ontogenesis
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.6" }
