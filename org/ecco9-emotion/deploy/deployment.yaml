# Emotion deployed as a Deployment: emotional dynamics are per-request state
# that any replica can serve; the AAR core re-converges after rescheduling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecco9-emotion
  namespace: ecco9-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-emotion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-emotion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # Co-locate with the reservoir: emotional effects modulate temporal
      # processing and must stay on the low-latency path.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ecco9-reservoir
                topologyKey: kubernetes.io/hostname
      containers:
        - name: emotion
          image: ghcr.io/dtechorg/ecco9-emotion:latest
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: http, containerPort: 8083 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: ECCO9_EMOTION_ADDR
              value: ":8083"
            - name: ECCO9_NATS_URL
              value: "nats://nats.ecco9-data:4222"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-emotion
  namespace: ecco9-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecco9-emotion
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.6" }
