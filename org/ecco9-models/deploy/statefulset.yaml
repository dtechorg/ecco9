apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecco9-models
  namespace: ecco9-inference
spec:
  serviceName: ecco9-models
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-models
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-models
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8095"
    spec:
      containers:
        - name: models
          image: ghcr.io/dtechorg/ecco9-models:latest
          ports:
            - { name: http, containerPort: 8095 }
          env:
            - name: ECCO9_MODELS_ADDR
              value: ":8095"
            - name: ECCO9_MODEL_STORE
              value: "/var/lib/ecco9/models"
            - name: ECCO9_MODEL_SEED_DIR
              value: "/var/lib/ecco9/models/seed"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: store, mountPath: /var/lib/ecco9/models }
          readinessProbe:
            httpGet: { path: /healthz, port: 8095 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8095 }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 4, memory: 8Gi }
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ecco9-models
  namespace: ecco9-inference
spec:
  selector:
    app.kubernetes.io/name: ecco9-models
  ports:
    - { name: http, port: 8095, targetPort: 8095 }
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-models
  namespace: ecco9-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ecco9-models
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.6" }
