# Identity deployed as a StatefulSet: embeddings and consciousness state are
# persistent — a pod must resume with the same identity vector after restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecco9-identity
  namespace: ecco9-memory
spec:
  serviceName: ecco9-identity
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-identity
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # Co-locate with memory: similarity search and hypergraph embeddings
      # share the same 768-dim vector space.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ecco9-memory
                topologyKey: kubernetes.io/hostname
      containers:
        - name: identity
          image: ghcr.io/dtechorg/ecco9-identity:latest
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: http, containerPort: 8084 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: ECCO9_IDENTITY_ADDR
              value: ":8084"
            - name: ECCO9_IDENTITY_NAME
              value: "deep-tree-echo"
            - name: ECCO9_IDENTITY_STATE_DIR
              value: "/var/lib/ecco9/identity"
            - name: ECCO9_NATS_URL
              value: "nats://nats.ecco9-data:4222"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: state, mountPath: /var/lib/ecco9/identity }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 2, memory: 4Gi }
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-identity
  namespace: ecco9-memory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ecco9-identity
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.6" }
