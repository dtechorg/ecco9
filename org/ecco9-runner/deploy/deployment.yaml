# Runner pinned to GPU nodes; requests nvidia GPUs and tolerates the
# gpu-pool taint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecco9-runner
  namespace: ecco9-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-runner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8094"
    spec:
      nodeSelector:
        ecco9.io/pool: gpu
      tolerations:
        - key: "ecco9.io/gpu-only"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: runner
          image: ghcr.io/dtechorg/ecco9-runner:latest
          ports:
            - { name: http, containerPort: 8094 }
          env:
            - name: ECCO9_RUNNER_ADDR
              value: ":8094"
            - name: ECCO9_MODELS_URL
              value: "http://ecco9-models.ecco9-inference:8095"
          volumeMounts:
            - { name: models, mountPath: /var/lib/ecco9/models }
          readinessProbe:
            httpGet: { path: /healthz, port: 8094 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8094 }
          resources:
            requests: { cpu: 2, memory: 8Gi, nvidia.com/gpu: 1 }
            limits: { cpu: 8, memory: 32Gi, nvidia.com/gpu: 1 }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ecco9-model-store
---
apiVersion: v1
kind: Service
metadata:
  name: ecco9-runner
  namespace: ecco9-inference
spec:
  selector:
    app.kubernetes.io/name: ecco9-runner
  ports:
    - { name: http, port: 8094, targetPort: 8094 }
---
# HPA on the cognitive_load custom metric, not CPU. GPU runners scale
# conservatively due to node cost.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-runner
  namespace: ecco9-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecco9-runner
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.75" }
