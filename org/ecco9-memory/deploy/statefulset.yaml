# Memory deployed as a StatefulSet: the hypergraph is sharded by node type
# and each shard keeps a persistent snapshot volume for snapshot recovery.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecco9-memory
  namespace: ecco9-memory
spec:
  serviceName: ecco9-memory
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-memory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-memory
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # Co-locate with identity: similarity search shares 768-dim embeddings.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ecco9-identity
                topologyKey: kubernetes.io/hostname
      containers:
        - name: memory
          image: ghcr.io/dtechorg/ecco9-memory:latest
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: http, containerPort: 8082 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: ECCO9_MEMORY_ADDR
              value: ":8082"
            - name: ECCO9_MEMORY_STATE_DIR
              value: "/var/lib/ecco9/memory"
            - name: ECCO9_NATS_URL
              value: "nats://nats.ecco9-data:4222"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: state, mountPath: /var/lib/ecco9/memory }
          resources:
            requests: { cpu: 1, memory: 2Gi }
            limits: { cpu: 2, memory: 8Gi }
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-memory
  namespace: ecco9-memory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ecco9-memory
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.6" }
