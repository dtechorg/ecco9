syntax = "proto3";

package ecco9.models.v1;

option go_package = "github.com/dtechorg/ecco9-sdk-go/gen/ecco9/models/v1;modelsv1";

// Model registry, conversion, and blob lifecycle.

message ModelInfo {
  string name = 1;
  string digest = 2;
  int64 size_bytes = 3;
  string format = 4; // gguf, safetensors, ...
  map<string, string> labels = 5;
  int64 modified_at_unix_ms = 6;
}

message PullModelRequest { string name = 1; }
message PullModelResponse {
  string status = 1;
  int64 completed_bytes = 2;
  int64 total_bytes = 3;
  bool done = 4;
}

message PushModelRequest { string name = 1; }
message PushModelResponse {
  string status = 1;
  bool done = 2;
}

message ListModelsRequest {}
message ListModelsResponse { repeated ModelInfo models = 1; }

message DeleteModelRequest { string name = 1; }
message DeleteModelResponse { bool deleted = 1; }

message ConvertModelRequest {
  string source_path = 1;
  string target_format = 2;
  string quantization = 3;
}
message ConvertModelResponse {
  string job_id = 1;
}

service ModelRegistryService {
  rpc PullModel(PullModelRequest) returns (stream PullModelResponse);
  rpc PushModel(PushModelRequest) returns (stream PushModelResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
  rpc ConvertModel(ConvertModelRequest) returns (ConvertModelResponse);
}
