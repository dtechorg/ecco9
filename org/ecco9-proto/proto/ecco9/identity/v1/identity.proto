syntax = "proto3";

package ecco9.identity.v1;

option go_package = "github.com/dtechorg/ecco9-sdk-go/gen/ecco9/identity/v1;identityv1";

// Identity provider with 768-dim embeddings, persona management,
// and theory-of-mind agent models.

message IdentityEmbedding {
  string identity_id = 1;
  repeated double vector = 2; // 768 dimensions
  int64 updated_at_unix_ms = 3;
}

message VerifyIdentityRequest { IdentityEmbedding embedding = 1; }
message VerifyIdentityResponse {
  bool verified = 1;
  double coherence = 2;
}

message SimilarityMatchRequest {
  repeated double vector = 1;
  int32 top_k = 2;
}
message SimilarityMatchResponse {
  repeated string identity_ids = 1;
  repeated double scores = 2;
}

message SwitchPersonaRequest {
  string identity_id = 1;
  string persona = 2;
}
message SwitchPersonaResponse { string applied_persona = 1; }

// Theory-of-mind model of another agent.
message AgentModel {
  string agent_id = 1;
  repeated string goals = 2;
  map<string, double> capabilities = 3;
  double trust_score = 4;
}

message GetAgentModelRequest { string agent_id = 1; }
message GetAgentModelResponse { AgentModel model = 1; }

service IdentityService {
  rpc VerifyIdentity(VerifyIdentityRequest) returns (VerifyIdentityResponse);
  rpc SimilarityMatch(SimilarityMatchRequest) returns (SimilarityMatchResponse);
  rpc SwitchPersona(SwitchPersonaRequest) returns (SwitchPersonaResponse);
  rpc GetAgentModel(GetAgentModelRequest) returns (GetAgentModelResponse);
}
