# Reservoir deployed as a StatefulSet with sharded reservoir partitions and
# persistent state history for checkpoint recovery.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecco9-reservoir
  namespace: ecco9-core
spec:
  serviceName: ecco9-reservoir
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-reservoir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-reservoir
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # Co-locate with the LLM gateway for minimal inference latency.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ecco9-llm-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: reservoir
          image: ghcr.io/dtechorg/ecco9-reservoir:latest
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: ECCO9_RESERVOIR_ADDR
              value: ":8081"
            - name: ECCO9_NATS_URL
              value: "nats://nats.ecco9-data:4222"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: state, mountPath: /var/lib/ecco9/reservoir }
          resources:
            requests: { cpu: 1, memory: 2Gi }
            limits: { cpu: 2, memory: 4Gi }
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-reservoir
  namespace: ecco9-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ecco9-reservoir
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.6" }
