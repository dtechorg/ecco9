# Gateway: external-facing API gateway. Active-active replicas behind a
# LoadBalancer Service; autoscales on the ecco9_cognitive_load metric.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecco9-gateway
  namespace: ecco9-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/dtechorg/ecco9-gateway:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: ECCO9_GATEWAY_ADDR
              value: ":8080"
            - name: ECCO9_SVC_RESERVOIR
              value: "http://ecco9-reservoir.ecco9-core:8081"
            - name: ECCO9_SVC_MEMORY
              value: "http://ecco9-memory.ecco9-core:8082"
            - name: ECCO9_SVC_EMOTION
              value: "http://ecco9-emotion.ecco9-core:8083"
            - name: ECCO9_SVC_IDENTITY
              value: "http://ecco9-identity.ecco9-core:8084"
            - name: ECCO9_SVC_ECHOBEATS
              value: "http://ecco9-echobeats.ecco9-core:8085"
            - name: ECCO9_SVC_CONSCIOUSNESS
              value: "http://ecco9-consciousness.ecco9-core:8086"
            - name: ECCO9_SVC_ATOMSPACE
              value: "http://ecco9-atomspace.ecco9-core:8087"
            - name: ECCO9_SVC_RELEVANCE
              value: "http://ecco9-relevance.ecco9-core:8088"
            - name: ECCO9_SVC_WISDOM
              value: "http://ecco9-wisdom.ecco9-core:8089"
            - name: ECCO9_SVC_METACOG
              value: "http://ecco9-metacog.ecco9-core:8090"
            - name: ECCO9_SVC_ONTOGENESIS
              value: "http://ecco9-ontogenesis.ecco9-core:8091"
            - name: ECCO9_SVC_ECHODREAM
              value: "http://ecco9-echodream.ecco9-core:8092"
            - name: ECCO9_SVC_LLM_GATEWAY
              value: "http://ecco9-llm-gateway.ecco9-core:8093"
            - name: ECCO9_SVC_RUNNER
              value: "http://ecco9-runner.ecco9-core:8094"
            - name: ECCO9_SVC_MODELS
              value: "http://ecco9-models.ecco9-core:8095"
            - name: ECCO9_SVC_ORCHESTRATOR
              value: "http://ecco9-orchestrator.ecco9-core:8096"
            - name: ECCO9_GATEWAY_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: ecco9-gateway-auth
                  key: api-keys
                  optional: true
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 1, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: ecco9-gateway
  namespace: ecco9-platform
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ecco9-gateway
  ports:
    - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-gateway
  namespace: ecco9-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecco9-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric:
          name: ecco9_cognitive_load
        target:
          type: AverageValue
          averageValue: "0.7"
