# EchoDream deployed as a StatefulSet: consolidated knowledge and extracted
# wisdom are durable cognitive artifacts that must survive restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecco9-echodream
  namespace: ecco9-higher
spec:
  serviceName: ecco9-echodream
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-echodream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-echodream
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # Co-locate with the memory service, the source of episodic memories.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ecco9-memory
                topologyKey: kubernetes.io/hostname
      containers:
        - name: echodream
          image: ghcr.io/dtechorg/ecco9-echodream:latest
          ports:
            - { name: http, containerPort: 8092 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: ECCO9_ECHODREAM_ADDR
              value: ":8092"
            - name: ECCO9_NATS_URL
              value: "nats://nats.ecco9-data:4222"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: dreams, mountPath: /var/lib/ecco9/echodream }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 2, memory: 4Gi }
  volumeClaimTemplates:
    - metadata:
        name: dreams
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ecco9-echodream
  namespace: ecco9-higher
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ecco9-echodream
  ports:
    - { name: http, port: 8092, targetPort: http }
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-echodream
  namespace: ecco9-higher
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ecco9-echodream
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.6" }
