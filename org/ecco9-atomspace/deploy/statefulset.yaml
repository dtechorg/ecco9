# AtomSpace deployed as a StatefulSet with persistent hypergraph volumes for
# checkpoint recovery of the knowledge store.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecco9-atomspace
  namespace: ecco9-memory
spec:
  serviceName: ecco9-atomspace
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ecco9-atomspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecco9-atomspace
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: atomspace
          image: ghcr.io/dtechorg/ecco9-atomspace:latest
          ports:
            - { name: http, containerPort: 8087 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: ECCO9_ATOMSPACE_ADDR
              value: ":8087"
            - name: ECCO9_NATS_URL
              value: "nats://nats.ecco9-data:4222"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: hypergraph, mountPath: /var/lib/ecco9/atomspace }
          resources:
            requests: { cpu: 1, memory: 2Gi }
            limits: { cpu: 2, memory: 8Gi }
  volumeClaimTemplates:
    - metadata:
        name: hypergraph
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ecco9-atomspace
  namespace: ecco9-memory
spec:
  clusterIP: None # headless: stable per-pod DNS for sharded hypergraph
  selector:
    app.kubernetes.io/name: ecco9-atomspace
  ports:
    - { name: http, port: 8087, targetPort: http }
---
# HPA on the cognitive_load custom metric, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecco9-atomspace
  namespace: ecco9-memory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: ecco9-atomspace
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric: { name: ecco9_cognitive_load }
        target: { type: AverageValue, averageValue: "0.6" }
