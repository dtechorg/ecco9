name: Autonomous Agent CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect legacy runtime changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --quiet "$BASE" HEAD -- . \
            ':(exclude)org/**' \
            ':(exclude).github/workflows/**'; then
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          else
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
      
      - name: Run gofmt
        run: |
          echo "Checking code formatting..."
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi
      
      - name: Run go vet
        if: steps.changes.outputs.legacy == 'true'
        run: |
          echo "Running go vet..."
          go vet ./...

      - name: Validate extracted service modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r mod; do
            dir="${mod%/go.mod}"
            echo "::group::${dir}"
            (cd "$dir" && go test ./... && go vet ./...)
            echo "::endgroup::"
          done < <(find org -mindepth 2 -maxdepth 2 -name go.mod -print | sort)

      - name: Validate protobuf contracts
        shell: bash
        run: |
          curl -fsSL https://github.com/bufbuild/buf/releases/download/v1.57.0/buf-Linux-x86_64 -o /tmp/buf
          chmod +x /tmp/buf
          (cd org/ecco9-proto && /tmp/buf lint && /tmp/buf build)
      
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
      
      - name: Run golangci-lint
        run: |
          echo "Running golangci-lint..."
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
      
      - name: Run Gosec Security Scanner
        run: |
          echo "Running security scan..."
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -fmt=json -out=gosec-report.json ./...
        continue-on-error: true
      
      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: gosec-report.json
          retention-days: 7

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
      
      - name: Check for vulnerabilities
        run: |
          echo "Checking dependencies for known vulnerabilities..."
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
        continue-on-error: true
      
      - name: List outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          go list -u -m all

  build-matrix:
    name: Build on Multiple Platforms
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23.0']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      
      - name: Build echoself
        run: go build -v -o echoself${{ matrix.os == 'windows-latest' && '.exe' || '' }} cmd/echoself/main.go
      
      - name: Verify binary
        if: matrix.os != 'windows-latest'
        run: |
          ls -lh echoself
          file echoself
      
      - name: Verify binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dir echoself.exe
