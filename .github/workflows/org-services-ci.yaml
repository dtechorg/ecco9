# Monorepo per-service CI for the org/ subtree (Phase 6.3, transition
# Phases A–C). While the extracted org/ecco9-* repos reach production
# parity, every change under org/<service>/ is validated with the same
# gates the standalone per-repo pipeline template applies:
# gofmt → go vet → go test (race + coverage) → build.
#
# Path-filtered per service so a change to ecco9-memory only runs the
# services whose dependency cone includes memory (sdk, eventmesh are
# always included as shared infrastructure).

name: org-services-ci

on:
  pull_request:
    paths:
      - 'org/**'
  push:
    branches: [main]
    paths:
      - 'org/**'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          # All org Go modules.
          all=$(find org -mindepth 2 -maxdepth 2 -name go.mod | xargs -n1 dirname | sort)
          # Modules touched by this change (plus shared infra fan-out: a
          # change to sdk-go re-tests every service that depends on it).
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha || 'HEAD~1' }}" HEAD \
            | grep '^org/' | cut -d/ -f1-2 | sort -u)
          if echo "$changed" | grep -qE 'org/ecco9-(sdk-go|proto|eventmesh)'; then
            selected="$all"
          else
            selected=$(comm -12 <(echo "$all") <(echo "$changed"))
          fi
          [ -n "$selected" ] || selected=""
          echo "services=$(echo "$selected" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || (echo "$unformatted" && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./...

  cross-repo-integration:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: cognitive integration + coherence + chaos + contract tests
        working-directory: org/ecco9-platform/ci/integration
        run: go test -tags=integration -count=1 -v ./...
